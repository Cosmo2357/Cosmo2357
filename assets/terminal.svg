<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" role="img" aria-label="Terminal demo: whoami, nmap, claude">
  <defs>
    <linearGradient id="taccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <clipPath id="t1"><rect x="18" y="46" width="0" height="16"><animate attributeName="width" calcMode="discrete" values="0;9;18;26;35;44;53;62;70" dur="0.6s" begin="cycle.begin+0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="18" y="86" width="0" height="16"><animate attributeName="width" calcMode="discrete" values="0;13;26;39;52;65;78;91;104;117;130;143;156" dur="1.2s" begin="cycle.begin+3s" fill="freeze"/></rect></clipPath>
    <clipPath id="t9"><rect x="18" y="206" width="0" height="16"><animate attributeName="width" calcMode="discrete" values="0;9;18;26;35;44;53;62;70" dur="0.6s" begin="cycle.begin+8.2s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="0" height="0" fill="none"><animate id="cycle" attributeName="width" values="0;0" dur="14s" begin="0s;cycle.end"/></rect>
  <rect x="0.5" y="0.5" width="679" height="339" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="20" cy="16" r="4.5" fill="#ff5f56"/><circle cx="38" cy="16" r="4.5" fill="#ffbd2e"/><circle cx="56" cy="16" r="4.5" fill="#27c93f"/>
  <text x="340" y="20" text-anchor="middle" fill="#6e7681" font-size="11">yufuki@github: ~</text>
  <rect x="1" y="30" width="678" height="1" fill="url(#taccent)" opacity="0.5"/>

  <g clip-path="url(#t1)">
    <text x="20" y="58" fill="#c9d1d9" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" to="1" dur="0.01s" begin="cycle.begin+0.5s" fill="freeze"/><tspan fill="#2dd4bf">$</tspan> whoami</text>
  </g>
  <text x="20" y="78" fill="#9da7b3" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" values="0;1" dur="0.25s" begin="cycle.begin+1.6s" fill="freeze"/>yufuki — full-stack developer · building a startup &amp; an NPO</text>
  <g clip-path="url(#t3)">
    <text x="20" y="98" fill="#c9d1d9" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" to="1" dur="0.01s" begin="cycle.begin+3s" fill="freeze"/><tspan fill="#2dd4bf">$</tspan> nmap -sV localhost</text>
  </g>
  <text x="20" y="118" fill="#9da7b3" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" values="0;1" dur="0.25s" begin="cycle.begin+4.6s" fill="freeze"/>Starting Nmap 7.95 ( https://nmap.org )</text>
  <text x="20" y="138" fill="#c9d1d9" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" values="0;1" dur="0.25s" begin="cycle.begin+5.2s" fill="freeze"/>PORT    STATE SERVICE</text>
  <text x="20" y="158" fill="#9da7b3" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" values="0;1" dur="0.25s" begin="cycle.begin+5.7s" fill="freeze"/><tspan fill="#60a5fa">22/tcp</tspan>  open  ssh</text>
  <text x="20" y="178" fill="#9da7b3" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" values="0;1" dur="0.25s" begin="cycle.begin+6.2s" fill="freeze"/><tspan fill="#60a5fa">443/tcp</tspan> open  https</text>
  <text x="20" y="198" fill="#9da7b3" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" values="0;1" dur="0.25s" begin="cycle.begin+6.9s" fill="freeze"/>Nmap done: 1 host up (0.012s latency)</text>
  <g clip-path="url(#t9)">
    <text x="20" y="218" fill="#c9d1d9" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" to="1" dur="0.01s" begin="cycle.begin+8.2s" fill="freeze"/><tspan fill="#2dd4bf">$</tspan> claude</text>
  </g>
  <text x="20" y="238" fill="#d97757" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" values="0;1" dur="0.25s" begin="cycle.begin+9.3s" fill="freeze"/>Claude Code — ready.</text>
  <text x="20" y="258" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" to="0" dur="0.01s" begin="cycle.begin" fill="freeze"/><animate attributeName="opacity" to="1" dur="0.01s" begin="cycle.begin+10.2s" fill="freeze"/>$</text>
  <rect x="34" y="247" width="7.5" height="14" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.5" dur="1.2s" begin="cycle.begin+10.2s" repeatCount="3"/></rect>
</svg>
