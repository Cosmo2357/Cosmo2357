<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Yufuki Hayashi — Full-Stack Developer · AI Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="accentFlow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="0.33" stop-color="#2dd4bf"/><stop offset="0.66" stop-color="#60a5fa"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.88" cy="0.15" r="0.55"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.55"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#000000" stroke-opacity="0.05"/></pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
    <clipPath id="typeClip"><rect class="type" x="60" y="140" width="480" height="45"/></clipPath>
  </defs>
  <style>
    .fade-up{opacity:0;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) forwards}
    .d1{animation-delay:.15s}
    .d2{animation-delay:2.5s}
    .pill{opacity:0;animation:fadeLeft .6s cubic-bezier(.22,1,.36,1) forwards}
    .p1{animation-delay:.35s}.p2{animation-delay:.5s}.p3{animation-delay:.65s}.p4{animation-delay:.8s}
    .type{transform:scaleX(0.001);animation:stretch 1.7s steps(34,end) .9s forwards}
    .bar{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;animation:stretch .6s cubic-bezier(.22,1,.36,1) 2.3s forwards}
    .caret{fill-opacity:0;animation:blink 1.1s linear 2.6s infinite}
    .flow{animation:flow 6s linear infinite}
    .glow-a{animation:breathe 7s ease-in-out infinite}
    .glow-b{animation:breathe 9s ease-in-out 2s infinite}
    .dot{animation:pulse 3.2s ease-in-out infinite}
    .dp2{animation-delay:.8s}.dp3{animation-delay:1.6s}.dp4{animation-delay:2.4s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fadeLeft{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
    @keyframes stretch{to{transform:scaleX(1)}}
    @keyframes blink{0%,54%{fill-opacity:1}55%,100%{fill-opacity:0}}
    @keyframes flow{from{transform:translateX(-1200px)}to{transform:translateX(0)}}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion: reduce){
      *{animation:none !important}
      .fade-up,.pill{opacity:1}
      .type,.bar{transform:none}
      .caret{fill-opacity:0}
    }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <g class="glow-a"><rect width="1200" height="300" fill="url(#glow1)"/></g>
    <g class="glow-b"><rect width="1200" height="300" fill="url(#glow2)"/></g>
    <g class="flow"><rect width="2400" height="5" fill="url(#accentFlow)"/></g>
    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#d0d7de"/>
  </g>
  <text class="fade-up d1" x="72" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#1f2328">Yufuki Hayashi</text>
  <g clip-path="url(#typeClip)">
    <text x="72" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#57606a">Full-Stack Developer · AI Engineering<tspan class="caret" dx="5" fill="#0d9488">|</tspan></text>
  </g>
  <rect class="bar" x="72" y="196" width="56" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="fade-up d2" x="72" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#6e7781">Next.js · React · React Native · Node.js · AWS · LangChain · LangGraph · Claude Code</text>


<g class="pill p1"><g transform="translate(951,72)"><rect width="177" height="40" rx="20" fill="#ffffff" stroke="#d0d7de"/><circle class="dot" cx="21" cy="20" r="4.5" fill="url(#accent)"/><text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#24292f">AI Engineering</text></g></g><g class="pill p2"><g transform="translate(1052,124)"><rect width="76" height="40" rx="20" fill="#ffffff" stroke="#d0d7de"/><circle class="dot dp2" cx="21" cy="20" r="4.5" fill="url(#accent)"/><text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#24292f">Web</text></g></g><g class="pill p3"><g transform="translate(1025,176)"><rect width="103" height="40" rx="20" fill="#ffffff" stroke="#d0d7de"/><circle class="dot dp3" cx="21" cy="20" r="4.5" fill="url(#accent)"/><text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#24292f">Mobile</text></g></g><g class="pill p4"><g transform="translate(1006,228)"><rect width="122" height="40" rx="20" fill="#ffffff" stroke="#d0d7de"/><circle class="dot dp4" cx="21" cy="20" r="4.5" fill="url(#accent)"/><text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#24292f">Security</text></g></g>
</svg>
